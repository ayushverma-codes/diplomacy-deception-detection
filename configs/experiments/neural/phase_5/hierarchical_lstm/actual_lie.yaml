{
  "architecture": "hierarchical_lstm",
  "task": "actual_lie",
  "seed": 1994,
  "data": {
    "max_messages": 8,
    "max_tokens": 128,
    "splits": {
      "train": "data/train.jsonl",
      "validation": "data/validation.jsonl",
      "test": "data/test.jsonl"
    }
  },
  "initialization": {
    "reuse_phase4_encoder": true
  },
  "model": {
    "embedding_dim": 200,
    "hidden_size": 100,
    "bidirectional": true,
    "num_layers": 1,
    "dropout": 0.5,
    "freeze_embeddings": true,
    "context_hidden_size": 100,
    "context_num_layers": 1
  },
  "bert": null,
  "power": null,
  "training": {
    "epochs": 15,
    "patience": 5,
    "batch_size": 2,
    "gradient_accumulation": 1,
    "mixed_precision": false,
    "learning_rate": 0.003,
    "optimizer": "adamw",
    "scheduler": "constant",
    "class_weight_mode": "paper",
    "positive_weight": 15.0,
    "gradient_clip": 1.0
  },
  "methodology": {
    "status": "adaptation_of_published_context_lstm",
    "note": "No test-set tuning. 8-message chunks; Phase 4 BiLSTM encoder reused for non-BERT."
  }
}
